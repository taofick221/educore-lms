services:
  web:
    build:
      context: ./backend
      dockerfile: ../Dockerfile

    container_name: educore_web

    command: python manage.py runserver 0.0.0.0:8000

    env_file:
      - ./backend/.env

    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432

    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/static:/app/static
      - educore_static:/app/staticfiles

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:16

    container_name: educore_db

    environment:
      POSTGRES_DB: ${DATABASE_NAME:-educore}
      POSTGRES_USER: ${DATABASE_USER:-educore}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-educore}

    ports:
      - "5432:5432"

    volumes:
      - educore_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-educore} -d ${DATABASE_NAME:-educore}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  educore_postgres_data:
  educore_static: